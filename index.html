<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>المغزى</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            background: #050505;
            color: #d4af37;
            font-family: Arial, Tahoma, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
        }

        .container {
            width: 100%;
            padding: 30px;
        }

        .title {
            font-size: 55px;
            font-weight: bold;
            color: #d4af37;
            margin-bottom: 50px;
        }

        .button {
            display: inline-block;

            background: #d4af37;
            color: #000;

            border: none;
            border-radius: 12px;

            padding: 18px 55px;

            font-size: 26px;
            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 0 25px rgba(212, 175, 55, 0.5);

            transition: 0.3s;
        }

        .button:hover {
            transform: scale(1.08);
            background: #f0cf5a;
        }

        #message {
            display: none;

            margin: 45px auto 0;

            max-width: 750px;

            padding: 35px 25px;

            border: 2px solid #d4af37;
            border-radius: 20px;

            background: #111;

            box-shadow: 0 0 30px rgba(212, 175, 55, 0.25);
        }

        #message p {
            color: #f0cf5a;
            font-size: 27px;
            font-weight: bold;
            line-height: 2;
            margin: 10px 0;
        }

        .line {
            width: 100px;
            height: 2px;
            background: #d4af37;
            margin: 20px auto;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="title">
            المغزى
        </div>

        <button class="button" onclick="showMessage()">
            اضغط هنا
        </button>

        <div id="message">

            <p>الاخوان شام وذهب ومحمد ونوف</p>

            <div class="line"></div>

            <p>ابناء عبدالستار الحميد</p>

            <div class="line"></div>

            <p>اذا ما درسو قرآن وطاعو امهم الوصهم لوص</p>

        </div>

    </div>

    <script>
        function showMessage() {
            document.getElementById("message").style.display = "block";
        }
    </script>

</body>

</html>
